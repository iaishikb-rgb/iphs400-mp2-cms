{% extends "base.html" %}
{% block content %}
  <h1>Posts</h1>
  <p><a href="/admin/posts/new">New Post</a> · <a href="/admin">Dashboard</a></p>
  {% if posts %}
  <ul>
    {% for post in posts %}
    <li>
      <a href="/admin/posts/{{ post.id }}">{{ post.title }}</a>
      — {{ post.status | capitalize }}, by {{ post.author_email }}
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No Posts yet.</p>
  {% endif %}
{% endblock %}
